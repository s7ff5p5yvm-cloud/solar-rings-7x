name: Solar Rings 7X v3.26.47 - stabilna 37 + Photon fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Garmin Fenix 7X Pro Solar (OWM forecast first + lightweight Photon diagnostics)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract watch face source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          archive = Path('SolarRings7X_v3_26_47_SOURCE.zip')
          assert archive.is_file(), 'Brak SolarRings7X_v3_26_47_SOURCE.zip w katalogu glownym repozytorium'
          actual_hash = sha256(archive.read_bytes()).hexdigest()
          expected_hash = '35ba0b2334fb70098cbbd2e4e6c9c6bd9d2da2d015d3f1d20b97f6387c780999'
          assert actual_hash == expected_hash, 'BLEDNE ZRODLA: GitHub pobral niepoprawny lub stary plik SOURCE.zip. Wgraj nowa paczke i uruchom NOWY workflow.'
          print('SOURCE SHA256 OK:', actual_hash)
          dest = Path('SolarRings7X_build')
          dest.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Plik ZIP jest uszkodzony'
              for entry in z.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in entry.filename:
                      raise ValueError('Niedozwolona sciezka archiwum: '+entry.filename)
                  if entry.is_dir():
                      continue
                  target = dest / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
          for f in ('manifest.xml','monkey.jungle','source/SolarRings7X.mc','resources/settings/settings.xml'):
              assert (dest / f).is_file(), 'Brak pliku projektu: '+f
          manifest = (dest / 'manifest.xml').read_text(encoding='utf-8')
          test_code = (dest / 'tests_provider/test_response_diagnostics_v3267.py').read_text(encoding='utf-8')
          assert 'version="3.26.47"' in manifest, 'Manifest nie zawiera wersji 3.26.47'
          assert 'version="3.26.47"' in test_code, 'Nieaktualny test wersji - uzywasz zlego archiwum SOURCE'
          print('Rozpakowano projekt v3.26.47, testy wersji 3.26.47 OK')
          import xml.etree.ElementTree as ET
          tree = ET.parse(dest/'resources/settings/settings.xml').getroot()
          modes = next(v for v in tree if v.get('propertyKey')=='@Properties.gwPreviewV332')
          values = [int(x.get('value')) for x in modes.find('settingConfig')]
          assert values == [0, 15, 21], 'Stare niebezpieczne ekrany TEST pozostaly w menu'
          props = ET.parse(dest/'resources/settings/properties.xml').getroot()
          assert any(x.get('id')=='srOpenKeyV326' for x in props), 'Brakuje klucza OWM w ustawieniach'
          print('Menu testow OK: 0/15/21; klucz OWM zachowany')
          PYEXTRACT

      - name: Verify version, weather tests and XML
        shell: bash
        run: |
          set -euo pipefail
          cd SolarRings7X_build
          python3 check_version.py
          python3 -m unittest discover -s tests_provider -p 'test_*.py' -v
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for file in Path('.').rglob('*.xml'):
              ET.parse(file)
              print('XML OK:',file)
          PYXML

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Garmin Connect IQ SDK
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Decode existing Garmin developer key
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Brak sekretu CONNECTIQ_DEVELOPER_KEY_BASE64'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Compile both Fenix 7X Pro variants and IQ package
        shell: bash
        run: |
          set -euo pipefail
          cd SolarRings7X_build
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v32647.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -f monkey.jungle -d fenix7xpronowifi -o dist/SolarRings7X_v32647_nowifi.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v32647.iq -y "$RUNNER_TEMP/key.der" -w
          test -s dist/SolarRings7X_v32647.prg
          test -s dist/SolarRings7X_v32647_nowifi.prg
          test -s dist/SolarRings7X_v32647.iq

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X_v32647
          path: SolarRings7X_build/dist/*
          if-no-files-found: error
