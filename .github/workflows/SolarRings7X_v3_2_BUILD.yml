name: Build Solar Rings 7X v3.2 (3 rings)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Garmin Fenix 7X Pro
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract one ZIP into isolated work folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          root=Path('SolarRings7X_v3_2_SOURCE.zip')
          assert root.exists(), 'Upload SolarRings7X_v3_2_SOURCE.zip to repository root first'
          out=Path('watchface_v32')
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(root) as z:
              for member in z.infolist():
                  name=Path(member.filename)
                  if member.is_dir(): continue
                  if name.is_absolute() or '..' in name.parts: raise RuntimeError('Unsafe ZIP path')
                  target=out/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(member))
          assert (out/'manifest.xml').exists()
          PYTHON

      - name: Validate XML, 3+3 layout and 21 settings + automatic solar event
        shell: bash
        run: |
          set -euo pipefail
          python3 watchface_v32/tests/check_project.py
          echo 'Checked eight configurable fields, including automatic sunrise/sunset (option 35).' 

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Connect IQ SDK and Garmin device profiles
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Decode permanent signing key from GitHub secret
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Missing CONNECTIQ_DEVELOPER_KEY_BASE64 secret'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Build watch face PRG and signed store IQ
        shell: bash
        run: |
          set -euo pipefail
          cd watchface_v32
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v32.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v32.iq -y "$RUNNER_TEMP/key.der" -w

      - name: Install 7-Zip for Garmin SDK 9.x IQ packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          command -v 7z

      - name: Inspect IQ package and verify iPhone settings (ZIP or 7z)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess, zipfile, tempfile
          import xml.etree.ElementTree as ET

          project = Path('watchface_v32')
          iq = project / 'dist/SolarRings7X_v32.iq'
          report_path = project / 'diagnostics/iq_diagnostics.txt'
          report_path.parent.mkdir(parents=True, exist_ok=True)
          lines = []
          errors = []

          def log(s):
              print(s)
              lines.append(s)

          try:
              log('Solar Rings 7X v3.2 - IQ archive + iPhone settings check')
              for rel in ('resources/settings/properties.xml', 'resources/settings/settings.xml'):
                  src = project / rel
                  if not src.is_file():
                      errors.append('Missing source file: ' + str(src))
                      continue
                  tree = ET.parse(src)
                  log('Source resource OK: {} ({} entries)'.format(rel, len(tree.getroot())))

              if not iq.is_file() or iq.stat().st_size == 0:
                  errors.append('IQ file missing or empty: ' + str(iq))
              else:
                  header = iq.open('rb').read(8)
                  log('IQ size: {} bytes; signature: {}'.format(iq.stat().st_size, header.hex(' ')))
                  is_7z = header.startswith(bytes.fromhex('377abcaf271c'))
                  is_zip = zipfile.is_zipfile(iq)
                  if not (is_zip or is_7z):
                      errors.append('Unsupported IQ archive signature (neither ZIP nor 7z)')
                  else:
                      with tempfile.TemporaryDirectory(prefix='iq_contents_') as d:
                          dest = Path(d)
                          if is_7z:
                              log('Detected 7z archive (normal for current Garmin SDK).')
                              test = subprocess.run(['7z','t','-bsp0',str(iq)], capture_output=True, text=True)
                              if test.returncode != 0:
                                  errors.append('7z archive integrity check FAILED')
                                  log((test.stdout + test.stderr)[-4000:])
                              else:
                                  log('7z integrity check PASSED.')
                                  extracted = subprocess.run(['7z','x','-y','-bsp0','-o'+str(dest),str(iq)], capture_output=True, text=True)
                                  if extracted.returncode != 0:
                                      errors.append('Unable to extract 7z archive')
                                      log((extracted.stdout + extracted.stderr)[-4000:])
                          else:
                              log('Detected ZIP archive (older Garmin SDK).')
                              with zipfile.ZipFile(iq) as z:
                                  bad = z.testzip()
                                  if bad is not None:
                                      errors.append('Corrupt ZIP entry: ' + bad)
                                  else:
                                      z.extractall(dest)
                          names = sorted(p.relative_to(dest).as_posix() for p in dest.rglob('*') if p.is_file())
                          log('Archive contains {} files'.format(len(names)))
                          for name in names[:60]:
                              log('  ' + name)
                          matches = [p for p in dest.rglob('*') if p.is_file() and p.name.lower().endswith('settings.json')]
                          log('Generated settings JSON files: {}'.format([p.relative_to(dest).as_posix() for p in matches]))
                          if not matches:
                              errors.append('No generated *settings.json found inside .IQ')
                          else:
                              settings_data = b'\n'.join(p.read_bytes() for p in matches)
                              for key in (b'slotTop1V3', b'slotTop2V3', b'slotTop3V3', b'slotRing1V3', b'slotRing2V3', b'slotRing3V3', b'slotLowerV3', b'slotFooterV3', b'stormOnV3', b'fontClockV31', b'fontDateV31', b'fontWeatherV31', b'outerRingV31'):
                                  if key not in settings_data:
                                      errors.append('Missing key in exported settings: ' + key.decode())
                              if not errors:
                                  log('Phone configuration keys: VERIFIED.')
          except Exception as e:
              errors.append(type(e).__name__ + ': ' + str(e))
          finally:
              for err in errors:
                  log('ERROR: ' + err)
              log('RESULT: ' + ('PASS' if not errors else 'FAIL'))
              report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          if errors:
              raise SystemExit(1)
          PYTHON

      - name: Upload binaries and diagnostics even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X-v32-build
          path: |
            watchface_v32/dist/*
            watchface_v32/diagnostics/*
          if-no-files-found: warn
          retention-days: 7
