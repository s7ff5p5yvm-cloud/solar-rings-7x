name: Solar Rings v3.26.64 - Garmin Weather + Photon location - 5min warnings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Fenix 7X Pro Solar - Garmin Weather + Photon coordinates, 5min warnings"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate EXACT source v3.26.64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          archive = Path('SolarRings7X_v3_26_64_SOURCE.zip')
          assert archive.is_file(), 'Missing SOURCE.zip - upload this source file to repo root'
          actual = sha256(archive.read_bytes()).hexdigest()
          expected = 'c10dfb68dca5e820a38afe1853514bb734931e12bd37016ee0b7d61392dc2b35'
          assert actual == expected, 'Wrong/old source file! SHA256 differs. Upload v3.26.64 SOURCE.zip'
          dest = Path('SolarRings7X_build')
          dest.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Corrupted source ZIP'
              for entry in z.infolist():
                  path = Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in entry.filename
                  if entry.is_dir():
                      continue
                  target = dest / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
          manifest = (dest/'manifest.xml').read_text(encoding='utf-8')
          assert 'version="3.26.64"' in manifest
          assert '<iq:uses-permission id="Positioning"/>' in manifest, 'Missing Garmin weather location permission'
          assert not (dest/'source/SolarOpenNetwork.mc').exists()
          assert (dest/'source/SolarRingsGarminService.mc').is_file()
          assert '<iq:uses-permission id="Communications"/>' in manifest
          assert 'https://photon.komoot.io/reverse' in (dest/'source/SolarRingsGarminService.mc').read_text()
          print('Source SHA256 and version OK:', actual)
          PYEXTRACT

      - name: Test settings and XML contracts
        shell: bash
        run: |
          set -euo pipefail
          cd SolarRings7X_build
          python3 -m unittest discover -s tests_provider -p 'test_*.py' -v
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for x in Path('.').rglob('*.xml'):
              ET.parse(x)
              print('XML OK:', x)
          PYXML

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Garmin Connect IQ SDK
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Decode Garmin developer key
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Missing CONNECTIQ_DEVELOPER_KEY_BASE64'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Compile PRG for both models and IQ for Connect IQ Store
        shell: bash
        run: |
          set -euo pipefail
          cd SolarRings7X_build
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v32664.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -f monkey.jungle -d fenix7xpronowifi -o dist/SolarRings7X_v32664_nowifi.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v32664.iq -y "$RUNNER_TEMP/key.der" -w
          test -s dist/SolarRings7X_v32664.prg
          test -s dist/SolarRings7X_v32664_nowifi.prg
          test -s dist/SolarRings7X_v32664.iq

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X_v32664_Garmin_Photon
          path: SolarRings7X_build/dist/*
          if-no-files-found: error
