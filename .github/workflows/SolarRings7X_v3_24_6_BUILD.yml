name: Build Solar Rings 7X - Weather Sources v3.24.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Garmin Fenix 7X Pro Solar
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract watch face source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('SolarRings7X_v3_24_6_SOURCE.zip')
          assert archive.is_file(), 'Place SolarRings7X_v3_24_6_SOURCE.zip at repository root'
          dest=Path('SolarRings7X_weather')
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for entry in z.infolist():
                  p=Path(entry.filename)
                  if entry.is_dir(): continue
                  if p.is_absolute() or '..' in p.parts: raise ValueError('Invalid ZIP path')
                  target=dest/p
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
          assert (dest/'manifest.xml').is_file()
          PY

      - name: Verify project and preserved settings
        shell: bash
        run: |
          set -euo pipefail
          python3 SolarRings7X_weather/check_version.py
          python3 -m unittest discover -s SolarRings7X_weather/tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('SolarRings7X_weather')
          for p in root.rglob('*.xml'):
              ET.parse(p)
              print('XML OK:',p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Garmin Connect IQ SDK
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Load signing key from repository secret
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Missing secret CONNECTIQ_DEVELOPER_KEY_BASE64'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Compile PRG and signed IQ
        shell: bash
        run: |
          set -euo pipefail
          cd SolarRings7X_weather
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v3246.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v3246.iq -y "$RUNNER_TEMP/key.der" -w
          test -s dist/SolarRings7X_v3246.prg
          test -s dist/SolarRings7X_v3246.iq

      - name: Upload Garmin Weather Alerts build
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X_weather_v3246
          path: |
            SolarRings7X_weather/dist/SolarRings7X_v3246.prg
            SolarRings7X_weather/dist/SolarRings7X_v3246.iq
          if-no-files-found: error
