name: Build Solar Rings 7X v3 (3 rings)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Garmin Fenix 7X Pro
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract one ZIP into isolated work folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          root=Path('SolarRings7X_v3_SOURCE.zip')
          assert root.exists(), 'Upload SolarRings7X_v3_SOURCE.zip to repository root first'
          out=Path('watchface_v3')
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(root) as z:
              for member in z.infolist():
                  name=Path(member.filename)
                  if member.is_dir(): continue
                  if name.is_absolute() or '..' in name.parts: raise RuntimeError('Unsafe ZIP path')
                  target=out/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(member))
          assert (out/'manifest.xml').exists()
          PYTHON

      - name: Validate XML, 3+3 layout and 14 settings
        shell: bash
        run: |
          set -euo pipefail
          python3 watchface_v3/tests/check_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Connect IQ SDK and Garmin device profiles
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Decode permanent signing key from GitHub secret
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Missing CONNECTIQ_DEVELOPER_KEY_BASE64 secret'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Build watch face PRG and signed store IQ
        shell: bash
        run: |
          set -euo pipefail
          cd watchface_v3
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v3.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v3.iq -y "$RUNNER_TEMP/key.der" -w

      - name: Diagnose IQ package and verify iPhone settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import zipfile
          import xml.etree.ElementTree as ET

          iq = Path('watchface_v3/dist/SolarRings7X_v3.iq')
          report_path = Path('watchface_v3/diagnostics/iq_diagnostics.txt')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          lines = []

          def record(message):
              print(message)
              lines.append(message)

          valid = True
          record('Solar Rings 7X v3 - IQ packaging diagnostics')
          for p in ('watchface_v3/resources/settings/properties.xml',
                    'watchface_v3/resources/settings/settings.xml'):
              path = Path(p)
              if path.is_file():
                  try:
                      root = ET.parse(path).getroot()
                      record('Source XML OK: {} ({} entries)'.format(p, len(root)))
                  except ET.ParseError as e:
                      record('SOURCE XML INVALID: {}: {}'.format(p, e))
                      valid = False
              else:
                  record('SOURCE XML MISSING: {}'.format(p))
                  valid = False

          if not iq.is_file():
              record('ERROR: IQ file not created: {}'.format(iq))
              valid = False
          else:
              record('IQ size in bytes: {}'.format(iq.stat().st_size))
              record('IQ first 32 bytes (hex): {}'.format(iq.open('rb').read(32).hex(' ')))
              result = subprocess.run(['file', '-b', str(iq)],
                                      capture_output=True, text=True, check=False)
              record('Linux file identification: {}'.format(result.stdout.strip()))
              if not zipfile.is_zipfile(iq):
                  record('ERROR: This IQ is NOT a readable ZIP container. Garmin IQ exports should be ZIP archives.')
                  record('Do not submit it to Connect IQ before finding the cause.')
                  valid = False
              else:
                  try:
                      with zipfile.ZipFile(iq, 'r') as archive:
                          bad = archive.testzip()
                          if bad:
                              record('ERROR: corrupt ZIP entry: {}'.format(bad))
                              valid = False
                          names = archive.namelist()
                          record('IQ archive entries: {}'.format(len(names)))
                          for name in names[:30]:
                              record('  {}'.format(name))
                          matches = [n for n in names
                                     if n.lower().endswith('-settings.json')
                                     or n.lower().endswith('/settings.json')]
                          record('Settings JSON entries: {}'.format(matches))
                          if not matches:
                              record('ERROR: No generated settings JSON bundled in IQ')
                              valid = False
                          else:
                              content = b'\n'.join(archive.read(n) for n in matches)
                              for key in (b'slotTop1V3', b'slotRing2V3', b'stormOnV3'):
                                  if key not in content:
                                      record('ERROR: Missing phone setting {}'.format(key.decode()))
                                      valid = False
                  except (zipfile.BadZipFile, OSError) as exc:
                      record('ERROR: failed to inspect IQ ZIP: {}'.format(exc))
                      valid = False

          record('RESULT: {}'.format('PASS' if valid else 'FAIL - see diagnostics'))
          report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          if not valid:
              raise SystemExit(1)
          PYTHON

      - name: Upload binaries and diagnostics even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X-v3-diagnostics
          path: |
            watchface_v3/dist/*
            watchface_v3/diagnostics/*
          if-no-files-found: warn
          retention-days: 7
