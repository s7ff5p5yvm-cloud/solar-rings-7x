name: Build Solar Rings 7X v3 (3 rings)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Garmin Fenix 7X Pro
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract one ZIP into isolated work folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          root=Path('SolarRings7X_v3_SOURCE.zip')
          assert root.exists(), 'Upload SolarRings7X_v3_SOURCE.zip to repository root first'
          out=Path('watchface_v3')
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(root) as z:
              for member in z.infolist():
                  name=Path(member.filename)
                  if member.is_dir(): continue
                  if name.is_absolute() or '..' in name.parts: raise RuntimeError('Unsafe ZIP path')
                  target=out/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(member))
          assert (out/'manifest.xml').exists()
          PYTHON

      - name: Validate XML, 3+3 layout and 14 settings
        shell: bash
        run: |
          set -euo pipefail
          python3 watchface_v3/tests/check_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Connect IQ SDK and Garmin device profiles
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Decode permanent signing key from GitHub secret
        shell: bash
        env:
          GARMIN_RELEASE_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GARMIN_RELEASE_KEY" || { echo 'Missing CONNECTIQ_DEVELOPER_KEY_BASE64 secret'; exit 1; }
          printf '%s' "$GARMIN_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.der"
          chmod 600 "$RUNNER_TEMP/key.der"

      - name: Build watch face PRG and signed store IQ
        shell: bash
        run: |
          set -euo pipefail
          cd watchface_v3
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/SolarRings7X_v3.prg -y "$RUNNER_TEMP/key.der" -w
          monkeyc -e -f monkey.jungle -o dist/SolarRings7X_v3.iq -y "$RUNNER_TEMP/key.der" -w

      - name: Inspect store package for iPhone settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import zipfile
          from pathlib import Path
          p=Path('watchface_v3/dist/SolarRings7X_v3.iq')
          assert p.is_file() and p.stat().st_size > 0
          with zipfile.ZipFile(p) as z:
              matches=[n for n in z.namelist() if n.lower().endswith('-settings.json') or n.lower().endswith('/settings.json')]
              print('Bundled mobile settings:',matches)
              if not matches: raise SystemExit('No settings JSON in store IQ — DO NOT PUBLISH')
              values=b'\n'.join(z.read(n) for n in matches)
              for key in (b'slotTop1V3',b'slotRing2V3',b'stormOnV3'):
                  if key not in values: raise SystemExit('Missing settings key '+repr(key))
              print('Verified: configurable top, rings and pressure warning in .IQ')
          PYTHON

      - name: Upload built watch face files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SolarRings7X-v3-built
          path: watchface_v3/dist/*
          if-no-files-found: error
          retention-days: 14
