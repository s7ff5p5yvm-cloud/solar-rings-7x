name: "Compass Pro 7X v1.3 PRO - full screen, Turbo 80ms and WMM2025"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CompassPro7X_v1_3_SOURCE.zip"
      - ".github/workflows/CompassPro7X_v1_3_BUILD.yml"

permissions:
  contents: read

jobs:
  build:
    name: "Fenix 7X Pro - regression and SDK 9.3.0"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify version, hash and safely extract archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          archive=Path('CompassPro7X_v1_3_SOURCE.zip')
          expected='68a449cefb615a360040501056f706b8106301f5f295a71c35a2aca7d66c91c5'
          assert archive.is_file(), 'Missing CompassPro7X_v1_3_SOURCE.zip at repository root'
          actual=sha256(archive.read_bytes()).hexdigest()
          assert actual==expected, f'SOURCE ZIP SHA256 mismatch: {actual}'
          dest=Path('CompassPro7X_build')
          dest.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged ZIP archive'
              for item in z.infolist():
                  p=Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename
                  if item.is_dir(): continue
                  target=dest/p
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          manifest=(dest/'manifest.xml').read_text(encoding='utf-8')
          assert 'type="watch-app"' in manifest, 'Incorrect app type'
          assert 'version="1.3.0"' in manifest, 'Incorrect version'
          assert 'id="93F847268B3845A49991C28B7E590E2A"' in manifest, 'App ID changed'
          assert 'launcherIcon="@Drawables.LauncherIcon"' in manifest
          assert 'id="Sensor"' in manifest and 'id="Positioning"' in manifest
          assert (dest/'source/WMM2025.mc').is_file()
          print('Verified SHA-256:', actual)
          PY

      - name: Run local regression suite and validate XML
        shell: bash
        run: |
          set -euo pipefail
          cd CompassPro7X_build
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('.').rglob('*.xml'):
              ET.parse(path)
              print('Valid XML:',path)
          PY

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Garmin Connect IQ SDK
        uses: DuckSoft/setup-connectiq-actions@v1
        with:
          sdk-version: '9.3.0'
          install-devices: 'true'

      - name: Prepare developer signing key
        id: signing
        shell: bash
        env:
          RELEASE_KEY_B64: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEY_B64" ]; then
            printf '%s' "$RELEASE_KEY_B64" | base64 -d > "$RUNNER_TEMP/compass.der"
            echo 'release=true' >> "$GITHUB_OUTPUT"
            echo 'Signed using persistent existing release key'
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/compass.pem" 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/compass.pem" -out "$RUNNER_TEMP/compass.der" -nocrypt
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'TEST ONLY key: Connect IQ Store IQ export is intentionally disabled'
          fi
          chmod 600 "$RUNNER_TEMP/compass.der"

      - name: Compile both Fenix 7X Pro PRG variants
        shell: bash
        run: |
          set -euo pipefail
          cd CompassPro7X_build
          mkdir -p dist
          monkeyc -f monkey.jungle -d fenix7xpro -o dist/CompassPro7X_v1_3_fenix7xpro.prg -y "$RUNNER_TEMP/compass.der" -w -O 2
          monkeyc -f monkey.jungle -d fenix7xpronowifi -o dist/CompassPro7X_v1_3_fenix7xpronowifi.prg -y "$RUNNER_TEMP/compass.der" -w -O 2
          test -s dist/CompassPro7X_v1_3_fenix7xpro.prg
          test -s dist/CompassPro7X_v1_3_fenix7xpronowifi.prg
          wc -c dist/*.prg
          sha256sum dist/*.prg

      - name: Export Connect IQ Store package with persistent key
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd CompassPro7X_build
          monkeyc -e -f monkey.jungle -o dist/CompassPro7X_v1_3.iq -y "$RUNNER_TEMP/compass.der" -w -O 2
          test -s dist/CompassPro7X_v1_3.iq

      - name: Upload test and store binaries
        uses: actions/upload-artifact@v4
        with:
          name: CompassPro7X_v1_3_PRO_build
          path: |
            CompassPro7X_build/dist/*.prg
            CompassPro7X_build/dist/*.iq
          if-no-files-found: error
          retention-days: 30
